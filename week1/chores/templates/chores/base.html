<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chores{% endblock %} · {{ household.name }}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6f7f9;
      color: #1f2937;
      margin: 0;
      padding: 0;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    header h1 { margin: 0; font-size: 1.5rem; }
    header .household { color: #6b7280; font-size: 0.95rem; }
    .btn {
      display: inline-block;
      padding: 8px 14px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn.secondary { background: #e5e7eb; color: #111827; }
    .btn.small { padding: 4px 10px; font-size: 0.85rem; }
    .chore-list { list-style: none; padding: 0; margin: 0; }
    .chore-item {
      display: flex; align-items: center; gap: 12px;
      background: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .chore-item.done .title { text-decoration: line-through; color: #9ca3af; }
    .chore-item .title { flex: 1; font-size: 1rem; }
    .chore-item .assignee {
      font-size: 0.85rem;
      color: #4b5563;
      background: #f3f4f6;
      padding: 2px 8px;
      border-radius: 12px;
    }
    .empty { text-align: center; color: #6b7280; padding: 32px 0; }
    form { background: #fff; padding: 16px; border-radius: 8px; }
    form p { margin: 0 0 12px; }
    form label { display: block; font-weight: 600; margin-bottom: 4px; }
    form input, form select {
      width: 100%; padding: 8px 10px; border: 1px solid #d1d5db;
      border-radius: 6px; font-size: 1rem;
    }
    .messages { margin-bottom: 16px; }
    .messages li {
      list-style: none;
      background: #d1fae5;
      color: #065f46;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>{% block heading %}Chores{% endblock %}</h1>
        <div class="household">{{ household.name }}</div>
      </div>
      <a class="btn" href="{% url 'chores:create' %}">+ New chore</a>
    </header>

    {% if messages %}
      <ul class="messages">
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
